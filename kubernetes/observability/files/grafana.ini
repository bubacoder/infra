[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[auth.anonymous]
enabled = false
[users]
allow_sign_up = false
[security]
disable_gravatar = true
[log]
mode = console
[paths]
data = /var/lib/grafana
logs = /tmp
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning
{{ if .Values.grafana.oidc.enabled }}
[server]
root_url = {{ required "OIDC rootUrl required" .Values.grafana.oidc.rootUrl }}
[auth]
signout_redirect_url = {{ required "OIDC logoutUrl required" .Values.grafana.oidc.logoutUrl }}
[auth.generic_oauth]
enabled = true
name = Authentik
allow_sign_up = true
allow_assign_grafana_admin = false
scopes = openid profile email offline_access
use_pkce = true
use_refresh_token = true
auth_url = {{ required "OIDC authBaseUrl required" .Values.grafana.oidc.authBaseUrl }}/authorize/
token_url = {{ .Values.grafana.oidc.authBaseUrl }}/token/
api_url = {{ .Values.grafana.oidc.authBaseUrl }}/userinfo/
client_id = $__file{/etc/grafana/oidc/client_id}
client_secret = $__file{/etc/grafana/oidc/client_secret}
{{ end }}
