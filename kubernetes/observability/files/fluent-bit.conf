[SERVICE]
    Flush 2
    Grace 30
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    Health_Check On
    storage.path /state/buffer
    storage.sync normal
    storage.checksum On
    storage.max_chunks_up 16
    storage.backlog.mem_limit 8M
    scheduler.base 5
    scheduler.cap 60

[INPUT]
    Name tail
    Tag kube.*
    Path {{ range $i, $namespace := .Values.collector.namespaces }}{{ if $i }},{{ end }}/var/log/containers/*_{{ $namespace }}_*.log{{ end }}
    multiline.parser cri
    DB /state/tail.db
    DB.Sync Normal
    DB.Locking On
    DB.Compare_Filename On
    Read_from_Head Off
    Refresh_Interval 5
    Rotate_Wait 30
    Buffer_Chunk_Size 64k
    Buffer_Max_Size 1M
    Skip_Long_Lines On
    storage.type filesystem

[FILTER]
    Name kubernetes
    Match kube.*
    Kube_URL https://kubernetes.default.svc:443
    Kube_Tag_Prefix kube.var.log.containers.
    Merge_Log On
    Merge_Log_Key parsed
    Keep_Log On
    Labels On
    Annotations Off
    K8S-Logging.Parser Off
    K8S-Logging.Exclude Off

[FILTER]
    Name lua
    Match kube.*
    script /config/normalize.lua
    call normalize
    time_as_table On

[OUTPUT]
    Name loki
    Match kube.*
    Host {{ .Release.Name }}-loki
    Port 3100
    Labels cluster={{ .Values.cluster }},namespace=$namespace,app=$app,container=$container
    Auto_Kubernetes_Labels Off
    Line_Format json
    Retry_Limit no_limits
    storage.total_limit_size 256M
    net.connect_timeout 5
    net.io_timeout 10
