pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=queries:1m rate=5r/s;
    map $arg_limit $bounded_limit {
        "" 100;
        ~^(?:[1-9]|[1-9][0-9]|100)$ $arg_limit;
        default 0;
    }
    upstream loki { server {{ .Release.Name }}-loki:3100; }
    server {
        listen 8080;
        client_max_body_size 1k;
        location = /ready { return 200 "ready\n"; }
        location ~ ^/loki/api/v1/(query|query_range|labels|label/[a-zA-Z_][a-zA-Z0-9_]*/values|series|index/stats|status/buildinfo)$ {
            limit_except GET { deny all; }
            if ($bounded_limit = 0) { return 400; }
            limit_req zone=queries burst=5 nodelay;
            proxy_connect_timeout 3s;
            proxy_read_timeout 35s;
            proxy_set_header Authorization "";
            proxy_set_header X-Scope-OrgID "";
            set $args "$args&limit=$bounded_limit";
            proxy_pass http://loki;
        }
        location / { return 403; }
    }
    server {
        listen 8081;
        location = /metrics { proxy_pass http://loki/metrics; }
        location / { return 403; }
    }
}
