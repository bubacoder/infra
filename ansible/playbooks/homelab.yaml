#!/usr/bin/env ansible-playbook

- name: Setup Debian base
  hosts:
    - debian
  roles:
    - role: debian_base

- name: Setup Docker-host
  hosts:
    - nas
    - nest
    - hive
    - colony
  roles:
    - role: debian_docker_host

- name: Setup Debian tools
  hosts:
    - nest
    - hive
    - colony
  roles:
    - role: debian_tools

- name: Setup Samba client
  hosts:
    - nest
    - colony
  roles:
    - role: debian_samba_client

- name: Setup Ubuntu desktop software
  hosts:
    - colony
  roles:
    - role: ubuntu_desktop
