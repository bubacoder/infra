---
- name: Check private secret-file permissions without exposing contents
  ansible.builtin.stat:
    path: "{{ bootstrap_dir }}/secrets.yaml"
    follow: false
  register: bootstrap_secret_stat
- name: Require a private regular secrets file
  ansible.builtin.assert:
    that:
      - bootstrap_secret_stat.stat.isreg | default(false)
      - not bootstrap_secret_stat.stat.islnk | default(false)
      - bootstrap_secret_stat.stat.mode in ['0600', '0400']
- name: Load secrets with Ansible's redaction (also supports ansible-vault)
  ansible.builtin.include_vars:
    file: "{{ bootstrap_dir }}/secrets.yaml"
    name: bootstrap_secrets
  no_log: true
- name: Validate secret values without rendering them in failures
  ansible.builtin.assert:
    that:
      - bootstrap_secrets.cloudflare_token is string
      - bootstrap_secrets.cloudflare_token is match('^[A-Za-z0-9_-]+$')
      - not bootstrap_secrets.cloudflare_token.startswith('REPLACE')
      - bootstrap.dns.adguard_url is not defined or (bootstrap_secrets.adguard_username is defined and bootstrap_secrets.adguard_password is defined)
  no_log: true
