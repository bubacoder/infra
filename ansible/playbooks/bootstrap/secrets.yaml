---
- name: Check private secret-file permissions without exposing contents
  ansible.builtin.stat:
    path: "{{ bootstrap_input_dir | default(bootstrap_dir) }}/secrets.yaml"
    follow: false
  register: bootstrap_secret_stat
- name: Require a private regular secrets file
  ansible.builtin.assert:
    that:
      - bootstrap_secret_stat.stat.isreg | default(false)
      - not bootstrap_secret_stat.stat.islnk | default(false)
      - bootstrap_secret_stat.stat.mode in ['0600', '0400']
- name: Load secrets with Ansible's redaction (also supports ansible-vault)
  ansible.builtin.include_vars:
    file: "{{ bootstrap_input_dir | default(bootstrap_dir) }}/secrets.yaml"
    name: bootstrap_secrets
  no_log: true
- name: Validate secret values without rendering them in failures
  ansible.builtin.assert:
    that:
      - >-
        not (bootstrap.services | default([]) | length > 0 or bootstrap.k3s.traefik.enabled | default(false) or (bootstrap.target == 'aws' and
        (bootstrap.dns.enabled or (bootstrap_dns_teardown | default(false) and bootstrap.dns.cloudflare_zone | default('') | length > 0)))) or
        (bootstrap_secrets.cloudflare_token | default('') is string and
        bootstrap_secrets.cloudflare_token | default('') is match('^[A-Za-z0-9_-]+$') and
        not (bootstrap_secrets.cloudflare_token | default('')).startswith('REPLACE'))
      - not (bootstrap.dns.enabled or bootstrap_dns_teardown | default(false)) or (bootstrap.dns.adguard_url is not defined and bootstrap.dns.adguard_urls | default([]) | length == 0) or (bootstrap_secrets.adguard_username is defined and bootstrap_secrets.adguard_password is defined)
  no_log: true
