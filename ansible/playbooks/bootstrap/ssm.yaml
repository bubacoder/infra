---
# Small trust-boundary adapter: AWS CLI owns SSM transport; Ansible owns retries.
# Commands passed here must never contain service credentials.
- name: Submit secret-free command to the exact Terraform-owned instance
  ansible.builtin.command:
    argv:
      - aws
      - --region
      - "{{ bootstrap_aws.region }}"
      - ssm
      - send-command
      - --instance-ids
      - "{{ bootstrap_aws.instance_id }}"
      - --document-name
      - AWS-RunShellScript
      - --parameters
      - "{{ {'commands': [bootstrap_ssm_script], 'executionTimeout': ['900']} | to_json }}"
      - --output
      - json
  register: bootstrap_ssm_submit
  changed_when: false
- name: Wait for SSM invocation to finish (bounded)
  ansible.builtin.command:
    argv: [aws, --region, "{{ bootstrap_aws.region }}", ssm, get-command-invocation, --command-id, "{{ (bootstrap_ssm_submit.stdout | from_json).Command.CommandId }}", --instance-id, "{{ bootstrap_aws.instance_id }}", --output, json]
  register: bootstrap_ssm_result
  changed_when: false
  failed_when: false
  until: bootstrap_ssm_result.rc == 0 and (bootstrap_ssm_result.stdout | from_json).Status in ['Success', 'Failed', 'Cancelled', 'TimedOut']
  retries: 90
  delay: 10
- name: Require successful execution rather than merely a submitted command
  ansible.builtin.assert:
    that: (bootstrap_ssm_result.stdout | from_json).Status == 'Success'
    fail_msg: SSM check failed. Inspect cloud-init and the original resources; do not bypass SSH trust.
