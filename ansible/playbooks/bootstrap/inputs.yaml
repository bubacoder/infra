---
- name: Locate explicitly selected native inputs
  ansible.builtin.set_fact:
    bootstrap_dir: "{{ lookup('env', 'BOOTSTRAP_DIR') }}"
    bootstrap_input_dir: "{{ lookup('env', 'BOOTSTRAP_INPUT_DIR') | default(lookup('env', 'BOOTSTRAP_DIR'), true) }}"
    bootstrap_root: "{{ (playbook_dir + '/../..') | realpath }}"
    bootstrap_verify_only: "{{ lookup('env', 'BOOTSTRAP_VERIFY_ONLY') == '1' }}"
- name: Require an explicit supported target before loading inputs
  ansible.builtin.assert:
    that: lookup('env', 'BOOTSTRAP_TARGET') in ['aws', 'proxmox']
    fail_msg: Select TARGET=aws or TARGET=proxmox explicitly; neither is the default.
- name: Restrict bootstrap artifacts to the ignored config directory
  ansible.builtin.assert:
    that:
      - (bootstrap_dir | realpath).startswith(bootstrap_root + '/config/')
      - bootstrap_dir | length > 0
      - (bootstrap_input_dir | realpath) == (bootstrap_dir | realpath) or (bootstrap_input_dir | realpath) == ((bootstrap_dir + '/generated') | realpath)
    fail_msg: Choose a directory under config/ with BOOTSTRAP_CONFIG_DIR.
- name: Load public host settings
  ansible.builtin.include_vars:
    file: "{{ bootstrap_input_dir }}/host.yaml"
    name: bootstrap
- name: Validate host settings with Ansible's native argument specification
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ lookup('file', playbook_dir + '/bootstrap/spec.yaml') | from_yaml }}"
    provided_arguments: "{{ bootstrap }}"
- name: Bind public host settings to the explicit target
  ansible.builtin.assert:
    that: bootstrap.target == lookup('env', 'BOOTSTRAP_TARGET')
    fail_msg: TARGET does not match host.yaml. Select the correct target and its original configuration directory.
- name: Validate application constraints outside Terraform's responsibility
  ansible.builtin.assert:
    that:
      - bootstrap.target == bootstrap_required_target | default(bootstrap.target)
      - bootstrap.name is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - not (bootstrap.dns.enabled or bootstrap.services | length > 0) or bootstrap.domain | default('') is match('^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z][a-z0-9-]+$')
      - bootstrap.services | length == 0 or '@' in bootstrap.acme_email | default('')
      - bootstrap.services | length == 0 or bootstrap.repository_url | default('') is match('^https://[^@?# ]+$')
      - bootstrap.services | length == 0 or bootstrap.repository_ref | default('') | length > 0
      - bootstrap.services | length == 0 or not bootstrap.repository_ref | default('') is match('^-')
      - bootstrap.services | length == 0 or bootstrap.repository_ref | default('') is not search('\s')
      - bootstrap.services | length == 0 or not bootstrap.repository_ref | default('') is match('^REPLACE_WITH_')
      - bootstrap.services | length == 0 or bootstrap.timezone | default('') | length > 0
      - "'debian_docker_host' not in bootstrap.roles or (bootstrap.docker_volumes | default('')).startswith('/') and '..' not in (bootstrap.docker_volumes | default('')).split('/')"
      - "bootstrap.target != 'aws' or 'debian_docker_host' not in bootstrap.roles or (bootstrap.docker_volumes | default('')).startswith('/storage/')"
      - bootstrap.target != 'proxmox' or bootstrap.dns.cloudflare_zone | default('') == ''
      - bootstrap.target != 'aws' or not bootstrap.dns.enabled or bootstrap.dns.cloudflare_zone | default('') | length > 0
      - bootstrap.target != 'proxmox' or bootstrap.proxmox_vmid | default(0) | int > 0
      - bootstrap.target != 'proxmox' or (bootstrap.proxmox_host is defined and bootstrap.proxmox_username is defined and bootstrap.proxmox_address is defined)
      - bootstrap.target != 'proxmox' or (bootstrap.proxmox_agent_timeout_seconds | default(600) | int > 0 and bootstrap.proxmox_agent_timeout_seconds | default(600) | int <= 86400)
      - bootstrap.target != 'proxmox' or (bootstrap.proxmox_cloud_init_timeout_seconds | default(1800) | int > 0 and bootstrap.proxmox_cloud_init_timeout_seconds | default(1800) | int <= 86400)
      - bootstrap.dns.adguard_url | default('https://unused') is match('^https?://[^/@?#\s]+$')
      - bootstrap.dns.adguard_url is not defined or bootstrap.dns.adguard_urls is not defined
      - bootstrap.dns.adguard_urls | default([]) | unique | length == bootstrap.dns.adguard_urls | default([]) | length
      - bootstrap.dns.adguard_urls | default([]) | select('match', '^https?://[^/@?#\s]+$') | list | length == bootstrap.dns.adguard_urls | default([]) | length
      - not bootstrap.k3s.cilium.enabled | default(false) or 'k3s' in bootstrap.roles
      - not bootstrap.k3s.access.enabled | default(false) or 'k3s' in bootstrap.roles
      - not bootstrap.k3s.access.enabled | default(false) or bootstrap.k3s.access.install_context | default(false)
      - not bootstrap.k3s.access.enabled | default(false) or bootstrap.k3s.access.host | default('') is match('^[a-z0-9.-]+$')
      - not bootstrap.k3s.access.enabled | default(false) or bootstrap.k3s.access.context | default('') is match('^[a-z0-9-]+$')
    fail_msg: Correct the public host settings; use a published branch, tag or commit, deployment subdomain and HTTP(S) AdGuard origins without credentials, paths, query strings or fragments.
- name: Validate ordered role and service selections before contacting providers
  ansible.builtin.assert:
    that:
      - bootstrap.roles | unique | length == bootstrap.roles | length
      - bootstrap.services | unique | length == bootstrap.services | length
      - bootstrap.services | difference(['security/traefik', 'dashboard/homepage']) | length == 0
      - "bootstrap.services | length == 0 or 'debian_docker_host' in bootstrap.roles"
      - "'k3s' not in bootstrap.roles or bootstrap.services | length == 0"
      - "'dashboard/homepage' not in bootstrap.services or 'security/traefik' in bootstrap.services"
    fail_msg: >-
      Select unique local roles and supported services. Docker services require
      debian_docker_host; Homepage requires Traefik. Default K3s requires services: []
      to avoid ingress port conflicts.
- name: Require each selected role to exist locally rather than accepting paths or collection names
  ansible.builtin.assert:
    that:
      - item is match('^[a-z][a-z0-9_]*$')
      - (bootstrap_root + '/ansible/roles/' + item | realpath).startswith(bootstrap_root + '/ansible/roles/')
      - (bootstrap_root + '/ansible/roles/' + item + '/tasks/main.yaml') is file or (bootstrap_root + '/ansible/roles/' + item + '/tasks/main.yml') is file
    fail_msg: A selected role is unavailable under ansible/roles. Add the role before selecting it.
  loop: "{{ bootstrap.roles }}"
