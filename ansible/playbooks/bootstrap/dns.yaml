---
- name: Select DNS operation and required resolution names
  ansible.builtin.set_fact:
    bootstrap_dns_action: "{{ bootstrap_dns_action | default('preview' if bootstrap_verify_only | default(false) else 'present') }}"
    bootstrap_dns_domain: "{{ bootstrap.domain | default('') }}"
    bootstrap_dns_names: "{{ ([bootstrap.domain] + (['home.' + bootstrap.domain] if 'dashboard/homepage' in bootstrap.services | default([]) else []) + (['traefik.' + bootstrap.domain] if 'security/traefik' in bootstrap.services | default([]) else []) + ['bootstrap-check.' + bootstrap.domain]) if (bootstrap.domain | default('') | length > 0 and (bootstrap.dns.enabled or bootstrap.services | default([]) | length > 0)) else [] }}"
    bootstrap_dns_records: []
    bootstrap_adguard_urls: "{{ bootstrap.dns.adguard_urls | default([bootstrap.dns.adguard_url] if bootstrap.dns.adguard_url is defined else []) }}"
- name: Locate native DNS ownership receipt
  ansible.builtin.stat:
    path: "{{ bootstrap_dir }}/dns-state.yaml"
  register: bootstrap_dns_stat
- name: Load the non-secret ownership receipt
  ansible.builtin.include_vars:
    file: "{{ bootstrap_dir }}/dns-state.yaml"
    name: bootstrap_dns_receipt
  when: bootstrap_dns_stat.stat.exists
- name: Set the deployment DNS identity
  ansible.builtin.set_fact:
    bootstrap_dns_identity:
      target: "{{ bootstrap.target }}"
      name: "{{ bootstrap.name }}"
      domain: "{{ bootstrap_dns_domain }}"
      cloudflare_zone: "{{ bootstrap.dns.cloudflare_zone | default('') }}"
      adguard_urls: "{{ bootstrap_adguard_urls | sort }}"
- name: Normalize the receipt's endpoint identity without changing its ownership
  ansible.builtin.set_fact:
    bootstrap_dns_previous_urls: "{{ bootstrap_dns_receipt.identity.adguard_urls | default([bootstrap_dns_receipt.identity.adguard_url] if bootstrap_dns_receipt.identity.adguard_url | default('') | length > 0 else []) }}"
    bootstrap_dns_previous_identity: "{{ bootstrap_dns_receipt.identity | default({}) | dict2items | rejectattr('key', 'in', ['adguard_url', 'adguard_urls']) | items2dict }}"
- name: Preserve evidence of ambiguous writes or a changed DNS target
  ansible.builtin.assert:
    that:
      - not bootstrap_dns_stat.stat.exists or bootstrap_dns_receipt.records is defined
      - not bootstrap_dns_stat.stat.exists or (bootstrap_dns_receipt.records is sequence and bootstrap_dns_receipt.records is not string and bootstrap_dns_receipt.records is not mapping)
      - not bootstrap_dns_stat.stat.exists or bootstrap_dns_receipt.pending is defined
      - bootstrap_dns_receipt.pending | default(none) == none
      - >-
        not bootstrap_dns_stat.stat.exists or
        (bootstrap_dns_previous_identity | combine({'adguard_urls': bootstrap_dns_identity.adguard_urls})) == bootstrap_dns_identity
    fail_msg: DNS target changed or a write is uncertain. Inspect the providers and receipt privately; do not discard it or blindly retry.
- name: Require an unambiguous endpoint for every owned AdGuard record
  ansible.builtin.assert:
    that:
      - item.endpoint is defined or bootstrap_dns_previous_urls | length == 1
      - item.endpoint | default(bootstrap_dns_previous_urls | first | default('')) in bootstrap_dns_previous_urls
      - item.endpoint | default(bootstrap_dns_previous_urls | first | default('')) in bootstrap_adguard_urls
    fail_msg: Keep every endpoint with owned records configured until its approved cleanup completes.
  loop: "{{ bootstrap_dns_receipt.records | default([]) | selectattr('provider', 'equalto', 'adguard') | list }}"
- name: Restore created-record ownership without adopting pre-existing records
  ansible.builtin.set_fact:
    bootstrap_dns_records: "{{ bootstrap_dns_records + [item | combine({'endpoint': item.endpoint | default(bootstrap_dns_previous_urls | first | default(''))}) if item.provider == 'adguard' else item] }}"
  loop: "{{ bootstrap_dns_receipt.records | default([]) }}"
- name: Include every receipt-owned name during approved cleanup even if services were deselected
  ansible.builtin.set_fact:
    bootstrap_dns_names: "{{ (bootstrap_dns_names + (bootstrap_dns_records | map(attribute='name') | list)) | unique | list }}"
  when: bootstrap_dns_action == 'absent'
- name: Resolve the explicitly selected Cloudflare zone using Ansible's HTTP module
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ bootstrap.dns.cloudflare_zone | urlencode }}&status=active"
    headers: {Authorization: "Bearer {{ bootstrap_secrets.cloudflare_token }}"}
    follow_redirects: none
    use_proxy: false
    timeout: 20
  register: bootstrap_cf_zone
  no_log: true
  when: bootstrap.target == 'aws' and bootstrap.dns.cloudflare_zone is defined and (bootstrap.dns.enabled or bootstrap_dns_action == 'absent')
- name: Require one active zone and a dedicated deployment subdomain
  ansible.builtin.assert:
    that:
      - bootstrap_cf_zone.json.success
      - bootstrap_cf_zone.json.result | length == 1
      - bootstrap_dns_domain.endswith('.' + bootstrap.dns.cloudflare_zone)
  when: bootstrap.target == 'aws' and bootstrap.dns.cloudflare_zone is defined and (bootstrap.dns.enabled or bootstrap_dns_action == 'absent')
- name: Check explicit service records cannot defeat the wildcard (never create or adopt them)
  ansible.builtin.include_tasks: dns-record.yaml
  loop: "{{ bootstrap_dns_names[1:] }}"
  loop_control: {loop_var: bootstrap_dns_name}
  vars:
    bootstrap_dns_provider: cloudflare
    bootstrap_dns_action: preview
  when: bootstrap.target == 'aws' and bootstrap.dns.enabled
- name: Manage AWS address records with the native Cloudflare module
  ansible.builtin.include_tasks: dns-record.yaml
  loop: "{{ [bootstrap_dns_domain, '*.' + bootstrap_dns_domain] }}"
  loop_control: {loop_var: bootstrap_dns_name}
  vars:
    bootstrap_dns_provider: cloudflare
  when: bootstrap.target == 'aws' and bootstrap.dns.cloudflare_zone is defined and (bootstrap.dns.enabled or bootstrap_dns_action == 'absent')
- name: Manage optional local rewrites on every selected AdGuard endpoint
  ansible.builtin.include_tasks: dns-adguard.yaml
  loop: "{{ bootstrap_adguard_urls }}"
  loop_control: {loop_var: bootstrap_adguard_url}
  vars:
    bootstrap_dns_provider: adguard
  when: bootstrap.dns.enabled or bootstrap_dns_action == 'absent'
- name: Verify the administrative host's real resolver, not only provider API results
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ item }}"]
  loop: "{{ bootstrap_dns_names }}"
  register: bootstrap_dns_answer
  changed_when: false
  until: bootstrap_dns_answer.rc == 0 and (bootstrap_dns_answer.stdout | regex_findall('(?m)^([0-9.]+)\s') | unique | list) == [bootstrap_address]
  retries: 12
  delay: 5
  timeout: 15
  when: bootstrap_dns_action != 'absent' and not bootstrap_dns_preflight_only | default(false)
