version: '3'

vars:
  TARGET: '{{default "" .TARGET}}'
  # Proxmox-only vm-* helpers also work without TARGET; generic commands require it.
  BOOTSTRAP_CONFIG_DIR: '{{default (printf "config/bootstrap-%s" (default "proxmox" .TARGET)) .BOOTSTRAP_CONFIG_DIR}}'

tasks:
  init:
    desc: Initialize one private bootstrap.yaml without overwriting operator input
    requires: {vars: [{name: TARGET, enum: [aws, proxmox]}]}
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      BOOTSTRAP_SSH_PUBLIC_KEY: '{{default "" .BOOTSTRAP_SSH_PUBLIC_KEY}}'
    cmds: [python3 scripts/bootstrap_config.py init]

  show-config:
    desc: Show only allowlisted non-secret fields from private bootstrap.yaml
    requires: {vars: [{name: TARGET, enum: [aws, proxmox]}]}
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
    cmds: [python3 scripts/bootstrap_config.py show-config]

  status:
    desc: Read-only snapshot of provider, guest and K3s progress (no waits or generated input changes)
    requires: {vars: [{name: TARGET, enum: [aws, proxmox]}]}
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
    cmds: [python3 scripts/bootstrap_config.py status]

  plan:
    desc: Prepare native inputs and review the selected target
    requires: {vars: [{name: TARGET, enum: [aws, proxmox]}]}
    cmds: [{task: dispatch, vars: {ACTION: plan}}]

  apply:
    desc: Apply the reviewed target plan, then configure and verify
    requires: {vars: [{name: TARGET, enum: [aws, proxmox]}]}
    prompt: Apply the reviewed target plan? Resources can remain billable after failures.
    cmds: [{task: dispatch, vars: {ACTION: apply}}]

  configure:
    desc: Prepare inputs and configure/verify an existing guest (never provision)
    requires: {vars: [{name: TARGET, enum: [aws, proxmox]}]}
    cmds: [{task: dispatch, vars: {ACTION: configure}}]

  verify:
    desc: Verify DNS, HTTPS, application behavior, persistence and repeat Compose deployment
    requires: {vars: [{name: TARGET, enum: [aws, proxmox]}]}
    cmds: [{task: dispatch, vars: {ACTION: verify}}]

  destroy-plan:
    desc: Review full AWS destruction (requires DELETE_DATA=1)
    requires: {vars: [{name: TARGET, enum: [aws]}]}
    cmds: [{task: dispatch, vars: {ACTION: destroy-plan}}]

  destroy:
    desc: Destroy only the reviewed AWS deployment and verify cleanup
    requires: {vars: [{name: TARGET, enum: [aws]}]}
    prompt: Delete the reviewed AWS deployment and both disks permanently?
    cmds: [{task: dispatch, vars: {ACTION: destroy}}]

  destroy-cleanup:
    desc: Retry AWS post-destroy verification and owned DNS cleanup
    requires: {vars: [{name: TARGET, enum: [aws]}]}
    cmds: [{task: dispatch, vars: {ACTION: destroy-cleanup}}]

  vm-preflight:
    desc: Validate the selected fresh Proxmox VM without provisioning
    cmds: [{task: dispatch, vars: {ACTION: vm-preflight, TARGET: proxmox}}]

  vm-provision:
    desc: Provision the selected fresh Proxmox VM (never replace)
    cmds: [{task: dispatch, vars: {ACTION: vm-provision, TARGET: proxmox}}]

  vm-wait:
    desc: Wait for the selected existing Proxmox guest
    cmds: [{task: dispatch, vars: {ACTION: vm-wait, TARGET: proxmox}}]

  dispatch:
    internal: true
    requires: {vars: [{name: TARGET, enum: [aws, proxmox]}]}
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      DELETE_DATA: '{{default "0" .DELETE_DATA}}'
    cmds: ['python3 scripts/bootstrap_config.py {{.ACTION}}']

  # Compiler-only bridge: actual native stages stay internal to Task.
  native:
    requires:
      vars:
        - name: TARGET
          enum: [aws, proxmox]
        - name: ACTION
          enum: [plan, apply, configure, verify, destroy-plan, destroy, destroy-cleanup, vm-preflight, vm-provision, vm-wait]
    preconditions:
      - sh: test "${BOOTSTRAP_PREPARED:-}" = 1
        msg: Use the public bootstrap command to prepare inputs first.
    cmds:
      - task: 'native-{{.ACTION}}'

  test:
    desc: Run only bootstrap Python and Proxmox shell tests
    cmds:
      - uv run --with-requirements scripts/requirements.txt python3 -m unittest tests.test_bootstrap tests.test_bootstrap_config tests.test_bootstrap_status
      - task: test-shell

  test-shell:
    desc: Run Proxmox bootstrap shell tests
    cmds:
      - bash vm/test-lib-common.sh
      - bash vm/test-wait-for-cloud-init.sh

  native-plan:
    internal: true
    preconditions: [{sh: 'test "${BOOTSTRAP_PREPARED:-}" = 1', msg: Use bootstrap:plan to prepare inputs first.}]
    desc: Review the selected target (AWS saved Terraform plan; Proxmox read-only preflight)
    requires:
      vars:
        - name: TARGET
          enum: [aws, proxmox]
    cmds:
      - task: 'plan-{{.TARGET}}'

  plan-proxmox:
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
    internal: true
    cmds:
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-check.yaml --extra-vars bootstrap_required_target=proxmox
      - task: native-vm-preflight
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-proxmox-preflight.yaml

  plan-aws:
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
      TF_DATA_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/.terraform'
    internal: true
    preconditions:
      - sh: test "$BOOTSTRAP_TARGET" = aws
        msg: AWS planning requires TARGET=aws.
      - sh: test -r "$BOOTSTRAP_INPUT_DIR/aws.tfvars.json"
        msg: Run bootstrap:init TARGET=aws and edit bootstrap.yaml first.
      - sh: test ! -e terraform/aws-vm/bootstrap_destroy_override.tf
        msg: A destruction override remains after an interrupted operation. Inspect it before planning.
    cmds:
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-check.yaml --extra-vars bootstrap_required_target=aws
      - terraform -chdir=terraform/aws-vm init -input=false -backend-config="path=$BOOTSTRAP_DIR/aws.tfstate"
      - terraform -chdir=terraform/aws-vm validate
      - terraform -chdir=terraform/aws-vm plan -lock-timeout=30s -var-file="$BOOTSTRAP_INPUT_DIR/aws.tfvars.json" -out="$BOOTSTRAP_DIR/aws.tfplan"
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-preflight.yaml

  native-apply:
    internal: true
    preconditions: [{sh: 'test "${BOOTSTRAP_PREPARED:-}" = 1', msg: Use bootstrap:apply to check reviewed inputs first.}]
    requires:
      vars:
        - name: TARGET
          enum: [aws, proxmox]
    desc: Apply the saved AWS plan or provision Proxmox, then configure and verify the core host
    cmds:
      - task: 'apply-{{.TARGET}}'
      - task: native-configure

  apply-aws:
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
      TF_DATA_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/.terraform'
    internal: true
    preconditions:
      - sh: test -s "$BOOTSTRAP_DIR/aws.tfplan"
        msg: Run bootstrap:plan and review it first. Apply never generates another plan.
    cmds:
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-preflight.yaml
      - terraform -chdir=terraform/aws-vm apply -lock-timeout=30s "$BOOTSTRAP_DIR/aws.tfplan"

  apply-proxmox:
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
    internal: true
    cmds:
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-check.yaml --extra-vars bootstrap_required_target=proxmox
      - task: native-vm-preflight
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-proxmox-preflight.yaml
      - task: native-vm-provision

  native-configure:
    internal: true
    preconditions: [{sh: 'test "${BOOTSTRAP_PREPARED:-}" = 1', msg: Use bootstrap:configure to prepare inputs first.}]
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
      TF_DATA_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/.terraform'
    requires:
      vars:
        - name: TARGET
          enum: [aws, proxmox]
    desc: Configure/verify an already provisioned host using Ansible (no Terraform apply)
    cmds:
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap.yaml

  native-verify:
    internal: true
    preconditions: [{sh: 'test "${BOOTSTRAP_PREPARED:-}" = 1', msg: Use bootstrap:verify to prepare inputs first.}]
    requires:
      vars:
        - name: TARGET
          enum: [aws, proxmox]
    desc: Verify DNS, HTTPS, application behavior, persistence and repeat Compose deployment
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
      TF_DATA_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/.terraform'
      BOOTSTRAP_VERIFY_ONLY: '1'
    cmds:
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap.yaml

  native-destroy-plan:
    internal: true
    requires:
      vars:
        - name: TARGET
          enum: [aws]
    desc: Save a full AWS destroy plan (requires DELETE_DATA=1; no cloud changes)
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
      TF_DATA_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/.terraform'
      BOOTSTRAP_DELETE_DATA: '{{default "0" .DELETE_DATA}}'
    preconditions:
      - sh: test "${BOOTSTRAP_PREPARED:-}" = 1
        msg: Use bootstrap:destroy-plan to prepare inputs first.
      - sh: test -s "$BOOTSTRAP_DIR/aws.tfstate"
        msg: Never destroy with missing state. Select the deployment's existing backend first.
    cmds:
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-check.yaml --extra-vars bootstrap_required_target=aws
      - terraform -chdir=terraform/aws-vm init -input=false -backend-config="path=$BOOTSTRAP_DIR/aws.tfstate"
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-destroy-plan.yaml
      - terraform -chdir=terraform/aws-vm show "$BOOTSTRAP_DIR/destroy.tfplan"

  native-destroy:
    internal: true
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
      TF_DATA_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/.terraform'
    requires:
      vars:
        - name: TARGET
          enum: [aws]
    desc: Stop/unmount the guest, destroy the reviewed AWS deployment, verify absence and clean owned artifacts
    preconditions:
      - sh: test "${BOOTSTRAP_PREPARED:-}" = 1
        msg: Use bootstrap:destroy to check reviewed inputs first.
      - sh: test -s "$BOOTSTRAP_DIR/aws.tfstate" && test -s "$BOOTSTRAP_DIR/destroy.tfplan"
        msg: Use the original state and review bootstrap:destroy-plan first.
    cmds:
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-destroy.yaml --tags prepare
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-quiesce.yaml
      - terraform -chdir=terraform/aws-vm apply -lock-timeout=30s "$BOOTSTRAP_DIR/destroy.tfplan"
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-destroy.yaml --tags cleanup

  native-destroy-cleanup:
    internal: true
    desc: Retry post-destroy verification and owned DNS cleanup without reapplying a destroy plan
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: '{{.TARGET}}'
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
      TF_DATA_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/.terraform'
    requires:
      vars:
        - name: TARGET
          enum: [aws]
    preconditions:
      - sh: test "${BOOTSTRAP_PREPARED:-}" = 1
        msg: Use bootstrap:destroy-cleanup to prepare inputs first.
      - sh: test -s "$BOOTSTRAP_DIR/aws.tfstate" && test -s "$BOOTSTRAP_DIR/teardown-host.yaml"
        msg: Preserve the deployment's state and teardown handoff until cleanup succeeds.
    cmds:
      - ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-destroy.yaml --tags cleanup

  native-vm-provision:
    internal: true
    desc: Create/start a fresh Proxmox VM using the existing provisioner (never replaces an existing VM)
    silent: true
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: proxmox
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
    dotenv:
      - '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/generated/ubuntu-cloud.env'
    preconditions:
      - sh: test "${BOOTSTRAP_PREPARED:-}" = 1
        msg: Use bootstrap:vm-provision to prepare inputs first.
      - sh: test -r "$BOOTSTRAP_INPUT_DIR/ubuntu-cloud.env"
        msg: Run 'task bootstrap:init TARGET=proxmox' and edit the configuration first.
      - sh: test -n "${VMID:-}"
        msg: VMID must be set in the VM configuration.
      - sh: case "${VMID:-}" in *[!0-9]*|'') exit 1;; esac
        msg: VMID must be a positive integer.
    cmds:
      - echo "Provisioning VM ${VMID} on ${PROXMOX_HOST:-proxmox}"
      - rsync -a vm/ "${PROXMOX_HOST:-proxmox}:/tmp/vm/"
      - rsync -a "$BOOTSTRAP_INPUT_DIR/ubuntu-cloud.env" "${PROXMOX_HOST:-proxmox}:/tmp/vm/proxmox/"
      - BOOTSTRAP_PROXMOX_HOST="${PROXMOX_HOST:-proxmox}" BOOTSTRAP_SYNC_PUBLIC_KEY=1 ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-proxmox-key.yaml
      - ssh "${PROXMOX_HOST:-proxmox}" env LC_ALL=C LANG=C sudo env VM_SSH_PUBLIC_KEY_FILE=/tmp/vm/proxmox/bootstrap-authorized-key.pub bash /tmp/vm/proxmox/create-ubuntu-cloud-vm.sh
      - ssh "${PROXMOX_HOST:-proxmox}" env LC_ALL=C LANG=C sudo qm start "${VMID}"
      - ssh "${PROXMOX_HOST:-proxmox}" env LC_ALL=C LANG=C sudo bash /tmp/vm/proxmox/wait-for-cloud-init.sh "${VMID}" 600 "${EXPECTED_IPV4:-}"

  native-vm-wait:
    internal: true
    desc: Wait for an existing Proxmox VM through its guest agent
    silent: true
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
    dotenv:
      - '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/generated/ubuntu-cloud.env'
    preconditions:
      - sh: test "${BOOTSTRAP_PREPARED:-}" = 1
        msg: Use bootstrap:vm-wait to prepare inputs first.
      - sh: test -r "$BOOTSTRAP_INPUT_DIR/ubuntu-cloud.env"
        msg: Run 'task bootstrap:init TARGET=proxmox' and edit the configuration first.
      - sh: case "${VMID:-}" in *[!0-9]*|'') exit 1;; esac
        msg: VMID must be a positive integer.
    cmds:
      - rsync -a vm/ "${PROXMOX_HOST:-proxmox}:/tmp/vm/"
      - ssh "${PROXMOX_HOST:-proxmox}" env LC_ALL=C LANG=C sudo bash /tmp/vm/proxmox/wait-for-cloud-init.sh "${VMID}" 600 "${EXPECTED_IPV4:-}"

  native-vm-preflight:
    internal: true
    desc: Validate fresh Proxmox VM identity, storage, bridge and public key
    silent: true
    env:
      BOOTSTRAP_DIR: '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}'
      BOOTSTRAP_TARGET: proxmox
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ansible/ansible.cfg'
    dotenv:
      - '{{.ROOT_DIR}}/{{.BOOTSTRAP_CONFIG_DIR}}/generated/ubuntu-cloud.env'
    preconditions:
      - sh: test "${BOOTSTRAP_PREPARED:-}" = 1
        msg: Use bootstrap:vm-preflight to prepare inputs first.
      - sh: test -r "$BOOTSTRAP_INPUT_DIR/ubuntu-cloud.env"
        msg: Run 'task bootstrap:init TARGET=proxmox' and edit the configuration first.
      - sh: test -n "${VMID:-}" && test -n "${VM_STORAGE:-}" && test -n "${VM_BRIDGE:-}"
        msg: VMID, VM_STORAGE, and VM_BRIDGE must be set in the VM configuration.
      - sh: case "${VMID:-}" in *[!0-9]*|'') exit 1;; esac
        msg: VMID must be a positive integer.
      - sh: command -v ssh >/dev/null && command -v rsync >/dev/null
        msg: ssh and rsync must be installed on the administrative host.
    cmds:
      - BOOTSTRAP_PROXMOX_HOST="${PROXMOX_HOST:-proxmox}" BOOTSTRAP_SYNC_PUBLIC_KEY=0 ansible-playbook -i localhost, -c local ansible/playbooks/bootstrap-proxmox-key.yaml
      - |
        set -eu
        ssh "${PROXMOX_HOST:-proxmox}" env LC_ALL=C LANG=C bash -s -- "${VMID}" "${VMNAME}" "${VM_STORAGE}" "${VM_BRIDGE}" "${VM_MAC:-}" <<'REMOTE'
        set -eu
        vmid="$1"
        name="$2"
        storage="$3"
        bridge="$4"
        mac="${5:-}"
        if sudo test -e "/etc/pve/qemu-server/${vmid}.conf"; then
          echo "Error: VM ${vmid} already exists." >&2
          exit 1
        fi
        if sudo qm list | awk -v name="${name}" 'NR > 1 && $2 == name {found=1} END {exit !found}'; then
          echo "Error: VM name ${name} already exists." >&2
          exit 1
        fi
        if [ -n "${mac}" ] && sudo grep -Riq -- "${mac}" /etc/pve/qemu-server; then
          echo "Error: MAC ${mac} is already used." >&2
          exit 1
        fi
        sudo pvesm status --storage "${storage}" >/dev/null
        ip link show "${bridge}" >/dev/null
        sudo pvesh get /storage/local --output-format json | perl -MJSON::PP -e '$content = decode_json(<STDIN>)->{"content"} // q{}; exit !(grep { $_ eq "snippets" } split /,/, $content)'
        REMOTE
        echo "Preflight passed: VM ID ${VMID}, name ${VMNAME}, and MAC ${VM_MAC:-} are available."
