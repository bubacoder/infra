---
- name: Install SMB packages
  ansible.builtin.apt:
    pkg:
      - smbclient
      - cifs-utils
    state: present

- name: Warn if admin_password is not set
  ansible.builtin.debug:
    msg: "WARNING: 'admin_password' is not defined — skipping credentials file creation. Samba mounts may fail."
  when: admin_password is not defined

- name: Configure mounts for each SMB server
  ansible.builtin.include_tasks: 20-samba-server.yaml
  loop: "{{ debian_samba_client_servers }}"
  loop_control:
    loop_var: samba_server
