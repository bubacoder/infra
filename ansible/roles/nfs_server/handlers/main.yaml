---
- name: Restart NFS service
  listen: Restart managed NFS server
  become: true
  ansible.builtin.systemd_service:
    name: nfs-server
    state: restarted
    daemon_reload: true

- name: Require exports to reload without parser errors
  listen: Restart managed NFS server
  become: true
  ansible.builtin.command:
    argv: [exportfs, -ra]
  changed_when: true
  no_log: true
