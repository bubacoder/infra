---
- name: Wait for the Cilium agent rollout
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, --namespace=kube-system, rollout, status, daemonset/cilium, --timeout=30s]
  register: k3s_cilium_agent_ready
  changed_when: false
  until: k3s_cilium_agent_ready.rc == 0
  retries: 20
  delay: 5

- name: Wait for the Cilium operator rollout
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, --namespace=kube-system, rollout, status, deployment/cilium-operator, --timeout=30s]
  register: k3s_cilium_operator_ready
  changed_when: false
  until: k3s_cilium_operator_ready.rc == 0
  retries: 20
  delay: 5
