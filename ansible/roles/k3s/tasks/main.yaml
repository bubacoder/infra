---
- name: Install the default single-server K3s distribution
  become: true
  block:
    - name: Require a supported Debian-family systemd host
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - ansible_facts.service_mgr == 'systemd'
          - ansible_facts.architecture in ['x86_64', 'aarch64']
        fail_msg: The k3s role supports Debian/Ubuntu systemd hosts on amd64 or arm64.

    - name: Check whether the default K3s server is already installed
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_service

    - name: Install K3s only on the first run (no implicit upgrades)
      when: not k3s_service.stat.exists
      block:
        - name: Install HTTPS download prerequisites
          ansible.builtin.apt:
            name: [ca-certificates, curl]
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create a private installer cache
          ansible.builtin.file:
            path: /var/cache/k3s
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Download the official K3s installer over verified HTTPS
          ansible.builtin.get_url:
            url: https://get.k3s.io
            dest: /var/cache/k3s/install.sh
            owner: root
            group: root
            mode: '0700'

        - name: Install the stable K3s server with upstream defaults
          ansible.builtin.command:
            argv: [/bin/sh, /var/cache/k3s/install.sh, server]
            creates: /etc/systemd/system/k3s.service
          environment:
            INSTALL_K3S_SKIP_START: 'true'
          no_log: true

    - name: Configure the selected API hostname before K3s starts
      ansible.builtin.include_tasks: access.yaml
      when: k3s_access.enabled | default(false)

    - name: Enable and start the K3s server
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true

    - name: Restart an existing K3s server only when its API hostname changed
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
      when:
        - k3s_service.stat.exists
        - k3s_access_configuration is defined
        - k3s_access_configuration is changed

- name: Verify the default K3s server
  ansible.builtin.import_tasks: verify.yaml
  when: not ansible_check_mode
