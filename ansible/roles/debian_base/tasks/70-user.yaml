---
- name: Create admin user '{{ admin_user }}'
  ansible.builtin.user:
    name: "{{ admin_user }}"
    comment: "{{ admin_name }}"
    groups:
      - sudo
    shell: '/bin/bash'
    append: true

- name: Set password for admin user '{{ admin_user }}'
  when: admin_password|default('') != ''
  ansible.builtin.user:
    name: "{{ admin_user }}"
    password: "{{ admin_password | password_hash('sha512', password_salt) }}"

- name: Configure SSH key
  when: debian_base_configure_ssh_key | default(false) | ansible.builtin.bool
  block:
    - name: Create .ssh folder for user '{{ admin_user }}'
      ansible.builtin.file:
        path: "~{{ admin_user }}/.ssh"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        state: directory
        mode: '0700'
    - name: Check if SSH key file exists
      ansible.builtin.stat:
        path: "{{ debian_base_ssh_key_file }}"
      register: debian_base_ssh_key_stat
      delegate_to: localhost
      become: false
    - name: Fail if SSH key file is missing and no admin password is set
      when: not debian_base_ssh_key_stat.stat.exists and (admin_password | default('') == '')
      ansible.builtin.fail:
        msg: "SSH key file '{{ debian_base_ssh_key_file }}' not found and no admin_password set for user '{{ admin_user }}' — cannot configure secure access."
    - name: Set authorized key for user '{{ admin_user }}'
      when: debian_base_ssh_key_stat.stat.exists
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ lookup('file', debian_base_ssh_key_file) }}"

- name: Set git global config for user '{{ admin_user }}'
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  become: true
  become_user: "{{ admin_user }}"
  with_items:
    - name: "user.name"
      value: "{{ admin_name }}"
    - name: "user.email"
      value: "{{ admin_email }}"
    - name: "credential.helper"
      value: "store"
    - name: "pull.rebase"
      value: "true"
    - name: "core.editor"
      value: "vim"
