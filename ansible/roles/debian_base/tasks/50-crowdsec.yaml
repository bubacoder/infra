# Based on:
# https://packagecloud.io/crowdsec/crowdsec/install#manual-deb
# https://docs.crowdsec.net/u/bouncers/firewall/
# https://github.com/papanito/ansible-role-crowdsec/
#
# Configuration file: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
# Logs: /var/log/crowdsec-firewall-bouncer.log
---
- name: Add crowdsec apt repository
  ansible.builtin.deb822_repository:
    name: crowdsec
    types: deb
    uris: https://packagecloud.io/crowdsec/crowdsec/{{ ansible_facts["distribution"] | lower }}/
    suites: "{{ debian_base_crowdsec_suite | default(ansible_facts['distribution_release']) }}"
    components: main
    signed_by: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    state: present
  notify: Update apt cache

- name: Install crowdsec iptables bouncer
  ansible.builtin.apt:
    name: crowdsec-firewall-bouncer-iptables
    state: present

- name: Set crowdsec api_url for iptables bouncer
  ansible.builtin.lineinfile:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    regexp: "^api_url:"
    line: "api_url: {{ debian_base_crowdsec_local_api_url }}"
  when: debian_base_crowdsec_local_api_url|default('') != ''
  notify: Restart service crowdsec-firewall-bouncer

- name: Set crowdsec api_key for iptables bouncer
  ansible.builtin.lineinfile:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    regexp: "^api_key:"
    line: "api_key: {{ debian_base_crowdsec_local_api_key }}"
  when: debian_base_crowdsec_local_api_key|default('') != ''
  notify: Restart service crowdsec-firewall-bouncer

- name: Enable service crowdsec-firewall-bouncer
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    enabled: true
    state: started
  when:
    - debian_base_crowdsec_local_api_url|default('') != ''
    - debian_base_crowdsec_local_api_key|default('') != ''
