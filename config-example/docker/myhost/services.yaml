        state: down
      - name: stirling-pdf
        state: down
      - name: searxng
        state: up
      - name: firefox
        state: down
      - name: obsidian
        state: up
      - name: scanservjs
        state: up

  - ai:
      - name: ollama
        state: up
      - name: litellm
        state: up
      - name: open-webui
        state: up
      - name: open-webui-pipelines
        state: down
      - name: autogenstudio
        state: down
      - name: sillytavern
        state: down
      - name: qdrant
        state: up

  - communication:
      - name: mattermost
        state: up

  - fileshare:
      - name: qbittorrent
        state: up

