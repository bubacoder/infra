name: ollama
services:
  ollama:
    image: ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      OLLAMA_IGPU_ENABLE: "1"
    group_add:
      - "${GPU_RENDER_GID}"  # render group — numeric GID required (name may not exist in container)
      - "${GPU_VIDEO_GID}"   # video group
