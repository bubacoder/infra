name: ollama
services:
  ollama:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      OLLAMA_IGPU_ENABLE: "1"
    group_add:
      - "${GPU_RENDER_GID}"  # render group — numeric GID required (name may not exist in container)
      - "${GPU_VIDEO_GID}"   # video group
