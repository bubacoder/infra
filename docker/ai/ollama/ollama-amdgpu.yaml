name: ollama
services:
  ollama:
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      OLLAMA_IGPU_ENABLE: "1"
    group_add:
      - "${GPU_RENDER_GID}"  # render group — numeric GID required (name may not exist in container)
      - "${GPU_VIDEO_GID}"   # video group
