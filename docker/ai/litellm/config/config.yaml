# LiteLLM supports all the text / chat / vision models from OpenRouter
# https://docs.litellm.ai/docs/providers/openrouter
# https://openrouter.ai/models
#
# LiteLLM supports all Anthropic models
# https://docs.litellm.ai/docs/providers/anthropic
# https://docs.anthropic.com/en/docs/about-claude/models
#
# LiteLLM supports all models from Ollama
# https://docs.litellm.ai/docs/providers/ollama
# https://github.com/ollama/ollama

---
model_list:

  # --- Via Anthropic
  #  LiteLLM provider: https://docs.litellm.ai/docs/providers/anthropic
  #  Models: https://docs.anthropic.com/en/docs/about-claude/models/overview
  #  Model pricing: https://docs.claude.com/en/docs/about-claude/pricing
  #  Create API key: https://platform.claude.com/settings/keys
  #  Buy credits: https://platform.claude.com/settings/billing

  - model_name: claude-sonnet-4-6                # RECEIVED MODEL NAME
    litellm_params:                              # All params accepted by litellm.completion() - https://docs.litellm.ai/docs/completion/input
      model: anthropic/claude-sonnet-4-6         # MODEL NAME sent to `litellm.completion()`
      api_key: "os.environ/ANTHROPIC_API_KEY"    # Does os.getenv("ANTHROPIC_API_KEY")

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: claude-fable-5
    litellm_params:
      model: anthropic/claude-fable-5
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: "os.environ/ANTHROPIC_API_KEY"

  # --- Via OpenAI
  #  LiteLLM provider: https://docs.litellm.ai/docs/providers/openai
  #  Models: https://platform.openai.com/docs/models
  #  Create API key: https://platform.openai.com/api-keys
  #  Buy credits: https://platform.openai.com/settings/organization/billing/overview

  - model_name: gpt-5.6
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: "os.environ/OPENAI_API_KEY"

  # --- Via Google
  #  LiteLLM provider: https://docs.litellm.ai/docs/providers/gemini
  #  Models: https://ai.google.dev/gemini-api/docs/models
  #  Create API key: https://aistudio.google.com/apikey
  #  Buy credits: https://aistudio.google.com/apikey -> "Set up billing"

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: "os.environ/GEMINI_API_KEY"

  # --- Via Openrouter
  #  LiteLLM provider: https://docs.litellm.ai/docs/providers/openrouter
  #  Models: https://openrouter.ai/models
  #  Create API Key: https://openrouter.ai/settings/keys
  #  Buy credits: https://openrouter.ai/settings/credits

  # https://openrouter.ai/meta-llama/llama-4-maverick
  - model_name: llama-4-maverick
    litellm_params:
      model: openrouter/meta-llama/llama-4-maverick
      api_key: "os.environ/OPENROUTER_API_KEY"

  # https://openrouter.ai/deepseek/deepseek-v4-pro
  - model_name: deepseek-v4-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: "os.environ/OPENROUTER_API_KEY"

  # https://openrouter.ai/deepseek/deepseek-v4-pro-0813
  - model_name: deepseek-v4-pro-0813
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro-0813
      api_key: "os.environ/OPENROUTER_API_KEY"

  # https://openrouter.ai/x-ai/grok-4.6
  - model_name: grok-4.6
    litellm_params:
      model: openrouter/x-ai/grok-4.6
      api_key: "os.environ/OPENROUTER_API_KEY"

  # https://openrouter.ai/z-ai/glm-5.1
  - model_name: glm-5.1
    litellm_params:
      model: openrouter/z-ai/glm-5.1
      api_key: "os.environ/OPENROUTER_API_KEY"

  # https://openrouter.ai/openai/gpt-5.4-image-2
  - model_name: gpt-5.4-image-2
    litellm_params:
      model: openrouter/openai/gpt-5.4-image-2
      api_key: "os.environ/OPENROUTER_API_KEY"

  # --- Local models (Ollama)
  #  LiteLLM provider: https://docs.litellm.ai/docs/providers/ollama#using-ollama-apichat
  #  Models: https://ollama.com/search

  # Local model - Phi 4 Mini (3.8B)
  - model_name: ollama-local-phi
    litellm_params:
      model: ollama_chat/phi4-mini
      api_base: "os.environ/LOCAL_OLLAMA_API_BASE"
      api_key: "none"

  # Local model - Qwen 3 (8B)
  - model_name: ollama-local-qwen
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: "os.environ/LOCAL_OLLAMA_API_BASE"
      api_key: "none"

  # Local model - Nomic Embed Text
  - model_name: ollama-local-nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text:latest
      api_base: "os.environ/LOCAL_OLLAMA_API_BASE"
      api_key: "none"

  # Local model on Mac - Mistral 7b
  - model_name: ollama-mac-mistral
    litellm_params:
      model: ollama_chat/mistral:7b-instruct
      api_base: "os.environ/REMOTE_OLLAMA_API_BASE"
      api_key: "none"

router_settings:
  fallbacks:
    - gpt-5.5:
        - gpt-5.6
    - ollama-mac-mistral:
        - ollama-local-phi
