name: ddclient
services:
  ddclient:
    image: lscr.io/linuxserver/ddclient:4.0.0@sha256:61de8a998f00bcf468a361f0df6007fb6ee8b2c6e89ed1c431145a98caeb7755
    container_name: ddclient
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TIMEZONE}
      MYDOMAIN: ${MYDOMAIN}
      DDCLIENT_HOSTS: "${MYDOMAIN},*.${MYDOMAIN}"
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
    volumes:
      - ${DOCKER_VOLUMES}/ddclient:/config
      - ./config/ddclient.conf:/config/ddclient.conf:ro
    restart: unless-stopped
    labels:
      homepage.group: Tools
      homepage.name: ddclient
      homepage.icon: cloudflare.png
      homepage.href: https://dash.cloudflare.com/
      homepage.description: Dynamic DNS updater
