name: portainer-agent
services:
  agent:
    image: portainer/agent:2.45.0
    container_name: portainer-agent
    ports:
      - 9001:9001
    # kics-scan ignore-block
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    restart: always
