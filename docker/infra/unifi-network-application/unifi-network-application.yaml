name: unifi-network-application
services:
  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:10.6.106
    container_name: unifi-network-application
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TIMEZONE}
      MEM_LIMIT: 1024 # optional
      MEM_STARTUP: 1024 # optional
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${UNIFI_MONGO_USERNAME}
      MONGO_PASS: ${UNIFI_MONGO_PASSWORD}
      MONGO_DBNAME: ${UNIFI_MONGO_DBNAME}
      MONGO_AUTHSOURCE: admin
    volumes:
      - ${DOCKER_VOLUMES}/unifi-network-application:/config
    ports:
      - 8443:8443 # Unifi web admin port
      - 3478:3478/udp # Unifi STUN port
      - 10001:10001/udp # Required for AP discovery
      - 8080:8080 # Required for device communication
      # - 1900:1900/udp # optional - Required for Make controller discoverable on L2 network option - Error response from daemon: driver failed programming external connectivity on endpoint unifi-controllroller: Bind for 0.0.0.0:1900 failed: port is already allocated
      - 8843:8843 # optional - Unifi guest portal HTTPS redirect port
      - 8880:8880 # optional - Unifi guest portal HTTP redirect port
      - 6789:6789 # optional - For mobile throughput test
      - 5514:5514/udp # optional - Remote syslog port
    networks:
      - proxy
    labels:
      traefik.enable: true
      # Explicit rule needed: Traefik's defaultRule derives the host from the compose service name
      # (unifi-network-application), but the external hostname is unifi.${MYDOMAIN}.
      traefik.http.routers.unifi-network-application.rule: Host(`unifi.${MYDOMAIN}`)
      traefik.http.routers.unifi-network-application.middlewares: localaccess@file
      traefik.http.services.unifi-network-application.loadbalancer.server.port: 8443
      traefik.http.services.unifi-network-application.loadbalancer.server.scheme: https
      traefik.http.services.unifi-network-application.loadbalancer.serversTransport: insecureTransport@file
      homepage.group: Infra
      homepage.name: UniFi Network Application
      homepage.icon: unifi-controller.png
      homepage.href: https://unifi.${MYDOMAIN}/
      homepage.description: Wireless software engine
      homepage.widget.type: unifi
      homepage.widget.url: https://unifi.${MYDOMAIN}
      homepage.widget.username: ${UNIFI_LOCAL_VIEWONLY_USERNAME}
      homepage.widget.password: ${UNIFI_LOCAL_VIEWONLY_PASSWORD}
      # - homepage.widget.site: Site Name # optional

networks:
  proxy:
    external: true
