name: flaresolverr
services:
  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      TZ: ${TIMEZONE}
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.flaresolverr.middlewares: localaccess@file
      traefik.http.services.flaresolverr.loadbalancer.server.port: 8191
      homepage.group: Arr
      homepage.name: Flaresolverr
      homepage.icon: cloudflare.png
      homepage.href: https://flaresolverr.${MYDOMAIN}/
      homepage.description: Bypass Cloudflare protection

networks:
  proxy:
    external: true
