name: bazarr
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.1
    container_name: bazarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TIMEZONE}
    volumes:
      - ${DOCKER_VOLUMES}/bazarr/config:/config
      - ${STORAGE_MEDIA}:/media
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.bazarr.middlewares: localaccess@file
      traefik.http.services.bazarr.loadbalancer.server.port: 6767
      homepage.group: Arr
      homepage.name: Bazarr
      homepage.icon: bazarr.png
      homepage.href: https://bazarr.${MYDOMAIN}/
      homepage.description: Manage and download subtitles

networks:
  proxy:
    external: true
