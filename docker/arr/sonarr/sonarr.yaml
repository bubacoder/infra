name: sonarr
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TIMEZONE}
    volumes:
      - ${DOCKER_VOLUMES}/sonarr:/config
      - ${STORAGE_MEDIA}:/media
      - ${STORAGE_TORRENT_DOWNLOADS}:/downloads
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr.middlewares: localaccess@file
      traefik.http.services.sonarr.loadbalancer.server.port: 8989
      homepage.group: Arr
      homepage.name: Sonarr
      homepage.icon: sonarr.png
      homepage.href: https://sonarr.${MYDOMAIN}/
      homepage.description: Download series

networks:
  proxy:
    external: true
