name: metube
services:
  metube:
    image: alexta69/metube:2026.11.01@sha256:a97f455f4b56044debe1a5ce31ff01a9cb20e9e36322ba04f8dd2bb0539b9ec7
    container_name: metube
    restart: "unless-stopped"
    environment:
      UID: ${PUID}
      GID: ${PGID}
      # Using browser cookies:
      # https://github.com/alexta69/metube?tab=readme-ov-file#using-browser-cookies
      YTDL_OPTIONS: "{\"cookiefile\":\"/cookies/cookies.txt\"}"
    volumes:
      - ${STORAGE_DOWNLOADS}/youtube:/downloads
      - ${INFRA_CONFIG_PATH:-"./metube"}/metube-cookies.txt:/cookies/cookies.txt
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.metube.middlewares: localaccess-authentik@file
      traefik.http.services.metube.loadbalancer.server.port: 8081
      homepage.group: Media
      homepage.name: Metube
      homepage.icon: metube.png
      homepage.href: https://metube.${MYDOMAIN}/
      homepage.description: "[SSO] Video downloader"

networks:
  proxy:
    external: true
