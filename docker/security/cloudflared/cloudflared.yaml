name: cloudflared
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy
    labels:
      homepage.group: Security
      homepage.name: Cloudflared
      homepage.icon: cloudflare.png
      homepage.href: https://dash.cloudflare.com/
      homepage.description: "Cloudflare Tunnel"

networks:
  proxy:
    external: true
