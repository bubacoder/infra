name: cloudflared
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy
    labels:
      homepage.group: Security
      homepage.name: Cloudflared
      homepage.icon: cloudflare.png
      homepage.href: https://dash.cloudflare.com/
      homepage.description: "Cloudflare Tunnel"

networks:
  proxy:
    external: true
