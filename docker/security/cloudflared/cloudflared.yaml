name: cloudflared
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy
    labels:
      homepage.group: Security
      homepage.name: Cloudflared
      homepage.icon: cloudflare.png
      homepage.href: https://dash.cloudflare.com/
      homepage.description: "Cloudflare Tunnel"

networks:
  proxy:
    external: true
