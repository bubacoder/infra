# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json

# Issue one ACME certificate for the base domain, first-level subdomains, and development sites.
tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: letsencrypt
        domain:
          main: '{{env "MYDOMAIN"}}'
          sans:
            - '*.{{env "MYDOMAIN"}}'
            - '*.dev.{{env "MYDOMAIN"}}'
