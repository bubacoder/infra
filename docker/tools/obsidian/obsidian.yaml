name: obsidian
services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest@sha256:ed9e6042c95b1fff9f11d3dcf5ec3c8b98fd725124a1621b8d63bb725b5819ea
    container_name: obsidian
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE}
      PUID: ${PUID}
      PGID: ${PGID}
      CUSTOM_USER: ${OBSIDIAN_CUSTOM_USER:-}
      PASSWORD: ${OBSIDIAN_PASSWORD:-}
      LC_ALL: ${OBSIDIAN_LC_ALL:-}
    volumes:
      - ${DOCKER_VOLUMES}/obsidian:/config
      - ${STORAGE_OBSIDIAN}:/config/vaults
    shm_size: "1gb"
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.obsidian.rule: Host(`obsidian.${MYDOMAIN}`)
      traefik.http.routers.obsidian.middlewares: localaccess-authentik@file
      traefik.http.services.obsidian.loadbalancer.server.port: 3000
      homepage.group: Tools
      homepage.name: Obsidian
      homepage.icon: obsidian.png
      homepage.href: https://obsidian.${MYDOMAIN}/
      homepage.description: "[SSO] Knowledge base for Markdown files"

networks:
  proxy:
    external: true
