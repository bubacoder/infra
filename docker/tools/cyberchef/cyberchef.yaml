name: cyberchef
services:
  cyberchef:
    image: mpepping/cyberchef:v11.5.0@sha256:d75426ccf924157f4ade18d319b6eb0963559ac228d5e4a59b4c8fefcad9b420
    container_name: cyberchef
    restart: unless-stopped
    networks:
      - proxy
    labels:
      konverter.rollout.strategy: rolling
      traefik.enable: true
      traefik.http.routers.cyberchef.middlewares: localaccess@file
      traefik.http.services.cyberchef.loadbalancer.server.port: 8000
      homepage.group: Tools
      homepage.name: Cyberchef
      homepage.icon: cyberchef.png
      homepage.href: https://cyberchef.${MYDOMAIN}/
      homepage.description: Swiss Army Knife web app for data analysis
    healthcheck:
      test: [CMD-SHELL, "curl -sf -o /dev/null http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  proxy:
    external: true
