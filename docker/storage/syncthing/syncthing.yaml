name: syncthing
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:2.1.5
    container_name: syncthing
    restart: unless-stopped
    network_mode: host
    hostname: ${PRIMARY_NODE}
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TIMEZONE}
    volumes:
      - ${DOCKER_VOLUMES}/syncthing:/config
      - ${STORAGE_SYNCTHING}:/storage
    # Not needed due to 'network_mode: host'
    # ports:
    #   - 22000:22000/tcp
    #   - 22000:22000/udp
    #   - 21027:21027/udp
    labels:
      traefik.enable: true
      traefik.http.routers.syncthing.middlewares: localaccess@file
      traefik.http.services.syncthing.loadbalancer.server.port: 8384
      homepage.group: Storage
      homepage.name: Syncthing
      homepage.icon: syncthing.png
      homepage.href: https://syncthing.${MYDOMAIN}/
      homepage.description: "File Sync"
