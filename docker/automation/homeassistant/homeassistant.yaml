name: homeassistant
services:
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:2026.10.2@sha256:6e6257d3a396177d17834bb1fea6226c62380ffab77047a0bb3e325b5421a74b
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    hostname: ${PRIMARY_NODE}
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TIMEZONE}
    volumes:
      - ${DOCKER_VOLUMES}/homeassistant:/config
    expose:
      - 8123 # Web UI
    # devices:
    #   - /path/to/device:/path/to/device  # optional
    labels:
      traefik.enable: true
      traefik.http.routers.homeassistant.middlewares: localaccess@file
      traefik.http.routers.homeassistant.rule: Host(`ha.${MYDOMAIN}`)
      traefik.http.services.homeassistant.loadbalancer.server.port: 8123
      homepage.group: Automation
      homepage.name: HomeAssistant
      homepage.icon: home-assistant.png
      homepage.href: https://ha.${MYDOMAIN}/
      homepage.description: Open source home automation
