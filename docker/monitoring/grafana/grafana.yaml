# Grafana open source software enables you to query, visualize, alert on, and explore your metrics, logs, and traces wherever they are stored.
# Grafana OSS provides you with tools to turn your time-series database (TSDB) data into insightful graphs and visualizations.
# The Grafana OSS plugin framework also enables you to connect other data sources like NoSQL/SQL databases, ticketing tools like Jira or ServiceNow, and CI/CD tooling like GitLab.
# ([source](https://grafana.com/docs/grafana/latest/introduction/))
#
# Default admin user credentials: `admin` / `admin`
#
# Links:
# - Home: https://grafana.com/grafana/
# - Image: https://hub.docker.com/r/grafana/grafana-oss
# - Getting Started: https://grafana.com/docs/grafana/latest/fundamentals/getting-started/
# - New in v12: https://grafana.com/docs/grafana/latest/whatsnew/whats-new-in-v12-0/
#
# Recommended dashboards to import:
# - https://grafana.com/grafana/dashboards/1860-node-exporter-full/
# - https://grafana.com/grafana/dashboards/14282-cadvisor-exporter/
---
name: grafana
services:
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    restart: unless-stopped
    user: "0:0"
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${MYDOMAIN}/
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authentik
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_AUTHENTIK_CLIENT_ID:?Configure Grafana Authentik client ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana-authentik-client-secret
      # Revalidate Authentik application access when the five-minute access token expires.
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email offline_access
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://sso.${MYDOMAIN}/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://sso.${MYDOMAIN}/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: https://sso.${MYDOMAIN}/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://sso.${MYDOMAIN}/application/o/grafana/end-session/
    volumes:
      - ${DOCKER_VOLUMES}/grafana:/var/lib/grafana
    secrets:
      - grafana-authentik-client-secret
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.middlewares: localaccess@file
      traefik.http.services.grafana.loadbalancer.server.port: 3000
      homepage.group: Monitoring
      homepage.name: Grafana
      homepage.icon: grafana.png
      homepage.href: https://grafana.${MYDOMAIN}/
      homepage.description: "[SSO] Monitoring dashboard"

networks:
  proxy:
    external: true

secrets:
  grafana-authentik-client-secret:
    file: ${GRAFANA_AUTHENTIK_CLIENT_SECRET_PATH:?Configure Grafana Authentik client secret path}

