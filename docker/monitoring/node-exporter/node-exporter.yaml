name: node-exporter
services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - 9100:9100
    command:
      - '--path.rootfs=/host'
    # kics-scan ignore-block
    volumes:
      - '/:/host:ro,rslave'
