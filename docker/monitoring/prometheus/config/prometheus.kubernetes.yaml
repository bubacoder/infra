global:
  scrape_interval: 60s

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 120s
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"
          - "192.168.1.10:9100"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "endlessh"
    static_configs:
      - targets:
          - "endlessh.endlessh.svc:2112"
