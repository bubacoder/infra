name: uptime-kuma
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ${DOCKER_VOLUMES}/uptime-kuma:/app/data
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.uptime-kuma.middlewares: localaccess-authentik@file
      traefik.http.services.uptime-kuma.loadbalancer.server.port: 3001
      homepage.group: Monitoring
      homepage.name: Uptime Kuma
      homepage.icon: uptime-kuma.png
      homepage.href: https://uptime-kuma.${MYDOMAIN}/
      homepage.description: "[SSO] Monitoring tool"

networks:
  proxy:
    external: true
