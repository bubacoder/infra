name: mongodb
services:
  mongodb-init:
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    container_name: mongodb-init
    command: ["sh", "-c", "chown -R 999:999 /data/db"]
    volumes:
      - ${DOCKER_VOLUMES}/mongodb/data:/data/db

  mongodb:
    image: mongo:7.0.45-jammy@sha256:7fba8c37d681a79f22a85d2b06bd5ed121a7973c0a6ca20ed4887bb0a1548ce0
    container_name: mongodb
    restart: unless-stopped
    # kics-scan ignore-block
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MongoDB root password must be set}
    volumes:
      - ${DOCKER_VOLUMES}/mongodb/data:/data/db
      - ./config/initdb:/docker-entrypoint-initdb.d
    ports:
      - 27017:27017
    networks:
      - proxy
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: false
      homepage.group: Storage
      homepage.name: MongoDB
      homepage.icon: mongodb.png
      homepage.description: "Popular NoSQL document database"

networks:
  proxy:
    external: true
