name: adminer
services:
  adminer:
    image: adminer:6.0.1-standalone
    container_name: adminer
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE}
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER:-}
      ADMINER_DESIGN: ${ADMINER_DESIGN:-}
      ADMINER_PLUGINS: ${ADMINER_PLUGINS:-}
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.adminer.middlewares: localaccess-authentik@file
      traefik.http.services.adminer.loadbalancer.server.port: 8080
      homepage.group: Storage
      homepage.name: Adminer
      homepage.icon: adminer.png
      homepage.href: https://adminer.${MYDOMAIN}/
      homepage.description: "[SSO] Full-featured database management tool"

networks:
  proxy:
    external: true
