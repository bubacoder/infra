name: Pre-commit checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Audit scripts/requirements.txt
        id: audit
        run: pipx run pip-audit -r scripts/requirements.txt

      - name: Show fix instructions on failure
        if: failure() && steps.audit.outcome == 'failure'
        run: |
          echo "::error::Vulnerable dependencies found in scripts/requirements.txt"
          echo ""
          echo "To fix, update the affected packages in scripts/requirements.txt:"
          echo "  pipx run pip-audit -r scripts/requirements.txt --fix"
          echo ""
          echo "Then verify with:"
          echo "  pipx run pip-audit -r scripts/requirements.txt"

  audit-infra-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Audit scripts/infra-mcp
        id: audit
        run: |
          uv export --frozen --no-dev --directory scripts/infra-mcp > /tmp/infra-mcp-reqs.txt
          pipx run pip-audit -r /tmp/infra-mcp-reqs.txt

      - name: Show fix instructions on failure
        if: failure() && steps.audit.outcome == 'failure'
        run: |
          echo "::error::Vulnerable dependencies found in scripts/infra-mcp"
          echo ""
          echo "To fix, upgrade the affected package(s) in scripts/infra-mcp:"
          echo "  uv lock --upgrade-package <package> --directory scripts/infra-mcp"
          echo ""
          echo "Or upgrade all packages at once:"
          echo "  uv lock --upgrade --directory scripts/infra-mcp"
          echo ""
          echo "Then verify with:"
          echo "  uv export --frozen --no-dev --directory scripts/infra-mcp > /tmp/infra-mcp-reqs.txt"
          echo "  pipx run pip-audit -r /tmp/infra-mcp-reqs.txt"

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.14.3"

      - name: Install tflint
        run: |
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          export TFLINT_VERSION=v0.62.0
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Install terraform-docs
        run: |
          # renovate: datasource=github-releases depName=terraform-docs/terraform-docs extractVersion=^v(?<version>.+)$
          VERSION=0.20.0
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sSLo ./terraform-docs.tar.gz "https://terraform-docs.io/dl/v${VERSION}/terraform-docs-v${VERSION}-$(uname)-${ARCH}.tar.gz"
          tar -xzf terraform-docs.tar.gz terraform-docs
          chmod +x terraform-docs
          mv terraform-docs /usr/local/bin/terraform-docs
          rm terraform-docs.tar.gz

      # Note: collections will be installed to /opt/pipx/venvs/ansible-core/lib/python3.12/site-packages/ansible_collections (why?)
      - name: Install Ansible requirements
        run: cd ansible && ansible-galaxy install -vv -r requirements.yml

      - name: Pre-commit checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
